name: CopyShelf
options:
  bundleIdPrefix: com.sangam.copyshelf
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  CopyShelfCore:
    type: library.static
    platform: macOS
    sources: [CopyShelfCore]
    settings:
      base:
        PRODUCT_NAME: CopyShelfCore
        DEFINES_MODULE: YES
        CODE_SIGNING_ALLOWED: NO
  CopyShelf:
    type: application
    platform: macOS
    sources:
      - path: CopyShelf
        excludes: ["**/*.plist", "**/*.entitlements"]
    dependencies:
      - target: CopyShelfCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sangam.copyshelf
        PRODUCT_NAME: CopyShelf
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
    info:
      path: CopyShelf/Info.plist
      properties:
        CFBundleDisplayName: CopyShelf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
    entitlements:
      path: CopyShelf/CopyShelf.entitlements
      properties: {}
  CopyShelfCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [CopyShelfCoreTests]
    dependencies:
      - target: CopyShelfCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sangam.copyshelf.core-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
schemes:
  CopyShelf:
    build:
      targets:
        CopyShelf: all
  CopyShelfCore:
    build:
      targets:
        CopyShelfCore: all
    test:
      targets: [CopyShelfCoreTests]
